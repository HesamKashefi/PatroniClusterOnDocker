scope: postgres-cluster
namespace: database-cluster
name: "{{ .Host }}"

restapi:
  listen: 0.0.0.0:8008
  connect_address: "{{ .Host }}:8008"
  authentication:
    username: patroni
    password: patroni132pass

etcd3:
  hosts: etcd1:2379,etcd2:2379,etcd3:2379 # Replace with your etcd endpoint

bootstrap:
  dcs:
    ttl: 30
    loop_wait: 10
    retry_timeout: 10
    maximum_lag_on_failover: 1048576
    postgresql:
      use_pg_rewind: true # Enable pg_rewind for faster recovery
      use_slots: true # Enable replication slots
      pg_hba:
        # Allow replication connections from all containers in Docker network
        - host replication replicator 172.18.0.0/16 scram-sha-256
        - host replication replicator 10.10.0.0/16 scram-sha-256
        - host replication replicator 127.0.0.1/32 scram-sha-256

        # Allow normal client connections from all containers in Docker network
        - host all all 172.18.0.0/16 scram-sha-256
        - host all all 10.10.0.0/16 scram-sha-256

        # Optional: allow connections from localhost
        - host all all 127.0.0.1/32 trust
        - host all all ::1/128 trust
      parameters:
        wal_level: replica
        hot_standby: "on"
        max_wal_senders: 5
        max_replication_slots: 5
        wal_keep_size: 128MB

      initdb:
      - encoding: UTF8
      - data-checksums


  users:
    postgres:
      password: postgres123pass
      options:
        - createrole
        - createdb
    rewind:
      username: rewind_user
      password: rewind123password

postgresql:
  listen: 0.0.0.0:5432
  connect_address: "{{ .Host }}:5432"
  data_dir: /var/lib/postgresql/data
  pgpass: /tmp/pgpass
  authentication:
    replication:
      username: replicator
      password: replication123pass
    superuser:
      username: postgres
      password: postgres123pass
    rewind:
      username: rewind_user
      password: rewind123password
  parameters:
    archive_mode: "on"
    archive_command: /bin/true
  create_replica_methods:
    - pgbackrest
    - basebackup

tags:
  nofailover: false
  noloadbalance: false
  clonefrom: false
  nosync: false
