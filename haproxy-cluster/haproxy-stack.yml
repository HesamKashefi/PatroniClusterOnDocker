networks:
  db-cluster-network:
    # driver: overlay
    external: true

services:
  haproxy:
    image: haproxy:latest
    container_name: haproxy    
    # deploy:
    #   mode: replicated
    #   replicas: 2
    #   placement:
    #     constraints: [node.role == manager]
    ports:
      - "5000:5000"
      - "5001:5001"
      - "7000:7000"
    volumes:
      - ./haproxy.cfg:/usr/local/etc/haproxy/haproxy.cfg:ro
    networks:
      - db-cluster-network
